name: CI

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github-prv</id>
                <username>${env.GH_PRV_USERNAME}</username>
                <password>${env.GH_PRV_PASSWORD}</password>
              </server>
              <server>
                <id>github-org-smart-home</id>
                <username>${env.GH_PRV_USERNAME}</username>
                <password>${env.GH_PRV_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          overwrite-settings: false

      - name: Build with Maven
        env:
          GH_PRV_USERNAME: ${{ secrets.GH_PRV_USERNAME }}
          GH_PRV_PASSWORD: ${{ secrets.GH_PRV_PASSWORD }}
        run: mvn -B package --file pom.xml

      - name: Discord notification -> success
        uses: sarisia/actions-status-discord@v1
        if: ${{ success() }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "CI api-gateway-service - success"
      - name: Discord notification -> non-success
        uses: sarisia/actions-status-discord@v1
        if: ${{ !success() }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "CI api-gateway-service - failure"