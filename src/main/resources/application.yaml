spring:
  application:
    name: api-gateway-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: /home
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # connecting to a k8s Service either succeeds at once or the target is gone;
            # 30 s (the default) would just hold the caller. ConnectTimeoutException extends
            # ConnectException, so it lands in UpstreamUnavailableProcessor as a clean 502
            connect-timeout: 2000
            # all external traffic funnels through this one replica, so a wedged upstream must
            # not hold a request forever. Generous on purpose - the ai route overrides it,
            # because an OpenAI answer legitimately takes longer than any other call here
            response-timeout: 30s
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request.
      # This service opens the trace every external request is then followed by
      probability: 1.0

# k8s DNS names; every service listens on 6200 in the cluster
internal:
  service:
    ai:
      scheme: http
      host: ai-service
      port: 6200
    amx:
      scheme: http
      host: amx-service
      port: 6200
    boiler:
      scheme: http
      host: boiler-service
      port: 6200
    database:
      scheme: http
      host: database-service
      port: 6200
    heating:
      scheme: http
      host: heating-service
      port: 6200
    water:
      scheme: http
      host: water-service
      port: 6200

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local

# locally every service keeps its own port from the org table
internal:
  service:
    ai:
      host: localhost
      port: 6004
    amx:
      host: localhost
      port: 6001
    boiler:
      host: localhost
      port: 6007
    database:
      host: localhost
      port: 6005
    heating:
      host: localhost
      port: 6002
    water:
      host: localhost
      port: 6006

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

---

spring:
  config:
    activate:
      on-profile: test

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
